services:
  api:
    container_name: fitness-tracker
    working_dir: /app
    image: cosmtrek/air
    env_file:
      - path: api/.env
        required: false
    environment:
      DB_PATH: /data/fitness_tracker.db
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - sqlite-data:/data
    command: sh -c "air"

volumes:
  sqlite-data:
