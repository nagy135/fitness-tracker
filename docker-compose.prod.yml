services:
  api:
    container_name: fitness-tracker
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    env_file:
      - path: api/.env
        required: false
    environment:
      DB_PATH: /data/fitness_tracker.db
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data

  frontend:
    container_name: fitness-tracker-frontend
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production

volumes:
  sqlite-data:
